[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidian2vector-mcp"
version = "0.0.4"
description = "MCP Server for searching Obsidian notes via vector similarity"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "zdq" },
]
keywords = ["obsidian", "mcp", "vector", "search", "embedding"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "obsidian2vector>=0.0.4",
    "mcp>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/zhoudqa/obsidian2vector"
Repository = "https://github.com/zhoudqa/obsidian2vector"

[project.scripts]
obsidian2vector-mcp = "obsidian2vector_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
